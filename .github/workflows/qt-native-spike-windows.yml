name: JA · Prueba aislada Qt 6 Windows
on:
  push:
    branches:
      - experiment/qt6-native-spike
    paths:
      - 'experiments/qt6-native-spike/**'
      - '.github/workflows/qt-native-spike-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt 6.8.3 + Qt Multimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configurar compilación MSVC x64
        shell: pwsh
        run: cmake -S experiments/qt6-native-spike -B .build/qt6-native-spike -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Compilar programa nativo
        run: cmake --build .build/qt6-native-spike --config Release --parallel 2
      - name: Prueba automática básica (no prueba HDMI)
        run: ctest --test-dir .build/qt6-native-spike -C Release --output-on-failure
      - name: Crear paquete portátil experimental
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qt-native-spike-package | Out-Null
          Copy-Item '.build/qt6-native-spike/Release/ja-native-spike.exe' 'qt-native-spike-package/ja-native-spike.exe'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --qmldir 'experiments/qt6-native-spike' --dir 'qt-native-spike-package' 'qt-native-spike-package/ja-native-spike.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'experiments/qt6-native-spike/README.md' 'qt-native-spike-package/README.md'
      - uses: actions/upload-artifact@v4
        with:
          name: JA-Qt6-Spike-Windows-Portable
          path: qt-native-spike-package/**
          if-no-files-found: error
          retention-days: 7
